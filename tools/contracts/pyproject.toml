[project]
name = "studymind-contracts"
version = "1.0.0"
description = "Validates contracts/events/v1 and generates the wire types the services publish"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.13,<0.15",
]

[project.scripts]
studymind-contracts = "studymind_contracts.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studymind_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Shared lint and format settings for every Python project in this repository. The workers, when
# they arrive, inherit these by pointing their own pyproject at the same values.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
