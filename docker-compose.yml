services:
  postgres-auth:
    image: postgres:16
    container_name: studymind-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres-document:
    image: postgres:16
    container_name: studymind-postgres-document
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOC_DB_NAME}
      POSTGRES_USER: ${DOC_DB_USER}
      POSTGRES_PASSWORD: ${DOC_DB_PASSWORD}
    ports:
      - 5434:5432
    volumes:
      - postgres_document_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOC_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres-video:
    image: postgres:16
    container_name: studymind-postgres-video
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VIDEO_DB_NAME}
      POSTGRES_USER: ${VIDEO_DB_USER}
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD}
    ports:
      - 5435:5432
    volumes:
      - postgres_video_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDEO_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres-chat:
    image: postgres:16
    container_name: studymind-postgres-chat
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME}
      POSTGRES_USER: ${CHAT_DB_USER}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}
    ports:
      - 5436:5432
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: studymind-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:3-management
    container_name: studymind-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    container_name: studymind-qdrant
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: studymind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data

volumes:
  postgres_auth_data:
  postgres_document_data:
  postgres_video_data:
  postgres_chat_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  minio_data: