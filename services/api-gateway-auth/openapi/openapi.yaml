openapi: 3.0.3
info:
  title: StudyMind API Gateway and Auth API
  version: 1.0.0
  description: JWT authentication, user identity, and edge routing endpoints.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Users
  - name: Health
paths:
  /actuator/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Service health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login with email and password
      description: |
        On success the access token is in the body and the refresh token is set as an HttpOnly
        cookie, so the SPA never holds the long-lived credential in JavaScript.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token using HttpOnly cookie
      description: |
        Authenticated by the refresh cookie alone. No access token is required, which is the point:
        this is the endpoint the SPA calls once the access token has expired.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout and revoke refresh token
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Logout successful
        "401":
          $ref: "#/components/responses/Problem"
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        HttpOnly refresh token set by /auth/login. Revoking it is what /auth/logout does.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          example: 900
    UserProfile:
      type: object
      required: [user_id, email, role]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          example: USER
