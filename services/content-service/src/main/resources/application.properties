spring.application.name=content-service
server.port=${CONTENT_SERVICE_PORT:8081}

spring.datasource.url=jdbc:postgresql://${CONTENT_DB_HOST:localhost}:${CONTENT_DB_PORT:5434}/${CONTENT_DB_NAME:content_db}
spring.datasource.username=${CONTENT_DB_USER:studymind}
spring.datasource.password=${CONTENT_DB_PASSWORD:studymind}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:studymind}
spring.rabbitmq.password=${RABBITMQ_PASS:studymind}

# Contracts in contracts/events/v1 are snake_case; so is every response in openapi/openapi.yaml.
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:52428800}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:52428800}

studymind.events.exchange=${EVENTS_EXCHANGE:studymind.events}
studymind.ingestion.max-pdf-bytes=${MAX_PDF_BYTES:52428800}

studymind.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
studymind.storage.region=${STORAGE_REGION:us-east-1}
studymind.storage.bucket=${STORAGE_BUCKET:studymind}
studymind.storage.access-key=${MINIO_ROOT_USER:studymind}
studymind.storage.secret-key=${MINIO_ROOT_PASSWORD:studymind}

management.endpoints.web.exposure.include=health,info
